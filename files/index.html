<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #0d0b1e;
      --surface:    #1a1535;
      --surface2:   #221e42;
      --border:     #3a3260;
      --x-color:    #63b3ed;
      --x-glow:     rgba(99,179,237,0.35);
      --o-color:    #fc814a;
      --o-glow:     rgba(252,129,74,0.35);
      --win-color:  #48c78e;
      --win-glow:   rgba(72,199,142,0.3);
      --text:       #ede8ff;
      --muted:      #7c72a8;
      --accent:     #9f7aea;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(99,89,200,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(252,129,74,0.1) 0%, transparent 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem 2rem 1.75rem;
      width: 400px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* ── Title ── */
    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 0.18em;
      text-align: center;
      background: linear-gradient(135deg, var(--x-color) 0%, var(--accent) 50%, var(--o-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
    }

    /* ── Scores ── */
    .scores {
      display: flex;
      justify-content: space-around;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.1rem;
    }
    .score-item { text-align: center; }
    .score-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .score-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1;
    }
    .score-num.x { color: var(--x-color); text-shadow: 0 0 18px var(--x-glow); }
    .score-num.d { color: var(--muted); }
    .score-num.o { color: var(--o-color); text-shadow: 0 0 18px var(--o-glow); }

    /* ── Mode Buttons ── */
    .mode-row {
      display: flex;
      gap: 8px;
      margin-bottom: 0.85rem;
    }
    .mode-btn {
      flex: 1;
      padding: 7px 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover { background: var(--surface2); color: var(--text); }
    .mode-btn.active {
      background: var(--surface2);
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 0 14px rgba(159,122,234,0.2);
    }

    /* ── Status ── */
    .status {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      height: 22px;
      margin-bottom: 1rem;
      transition: color 0.3s;
    }

    /* ── Board ── */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 1rem;
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .cell::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .cell:hover:not(.taken)::after { opacity: 1; background: rgba(255,255,255,0.03); }
    .cell:hover:not(.taken) { transform: scale(0.97); border-color: var(--accent); }
    .cell.taken { cursor: default; }

    .cell.x {
      color: var(--x-color);
      border-color: rgba(99,179,237,0.35);
      box-shadow: inset 0 0 20px rgba(99,179,237,0.08);
      animation: pop 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    .cell.o {
      color: var(--o-color);
      border-color: rgba(252,129,74,0.35);
      box-shadow: inset 0 0 20px rgba(252,129,74,0.08);
      animation: pop 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    .cell.win {
      background: rgba(72,199,142,0.12);
      border-color: var(--win-color);
      box-shadow: 0 0 24px var(--win-glow), inset 0 0 24px rgba(72,199,142,0.1);
    }

    @keyframes pop {
      0%   { transform: scale(0.6); opacity: 0.4; }
      100% { transform: scale(1);   opacity: 1;   }
    }

    /* ── Action buttons ── */
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn:hover {
      background: var(--border);
      border-color: var(--accent);
    }
    .btn:active { transform: scale(0.97); }

    /* ── Win overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(13,11,30,0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      animation: fadeIn 0.25s ease;
    }
    .overlay.show { display: flex; }
    .overlay-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 2.5rem;
      text-align: center;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .overlay-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
    }
    .overlay-sub { color: var(--muted); font-size: 14px; margin-bottom: 1.25rem; }
    .overlay-btn {
      padding: 10px 32px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(99,89,200,0.3), rgba(159,122,234,0.2));
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .overlay-btn:hover { background: linear-gradient(135deg, rgba(99,89,200,0.5), rgba(159,122,234,0.4)); }

    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px) scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-title" id="overlayTitle">X Wins!</div>
    <div class="overlay-sub" id="overlaySub">Flawless victory</div>
    <button class="overlay-btn" onclick="closeOverlay()">Play again</button>
  </div>
</div>

<div class="card">
  <h1>TIC TAC TOE</h1>

  <div class="scores">
    <div class="score-item">
      <div class="score-label">X</div>
      <div class="score-num x" id="sx">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Draw</div>
      <div class="score-num d" id="sd">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">O</div>
      <div class="score-num o" id="so">0</div>
    </div>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" id="btnPvP" onclick="setMode('pvp')">2 Players</button>
    <button class="mode-btn" id="btnCPU" onclick="setMode('cpu')">vs Computer</button>
  </div>

  <div class="status" id="status" style="color: var(--x-color);">X's turn</div>

  <div class="board" id="board">
    <div class="cell" onclick="play(0)" id="c0"></div>
    <div class="cell" onclick="play(1)" id="c1"></div>
    <div class="cell" onclick="play(2)" id="c2"></div>
    <div class="cell" onclick="play(3)" id="c3"></div>
    <div class="cell" onclick="play(4)" id="c4"></div>
    <div class="cell" onclick="play(5)" id="c5"></div>
    <div class="cell" onclick="play(6)" id="c6"></div>
    <div class="cell" onclick="play(7)" id="c7"></div>
    <div class="cell" onclick="play(8)" id="c8"></div>
  </div>

  <div class="actions">
    <button class="btn" onclick="reset()">New Game</button>
    <button class="btn" onclick="resetAll()">Reset Scores</button>
  </div>
</div>

<script>
  let board = Array(9).fill(null);
  let current = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0, D: 0 };
  let mode = 'pvp';

  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const xColor = 'var(--x-color)';
  const oColor = 'var(--o-color)';

  function setMode(m) {
    mode = m;
    document.getElementById('btnPvP').classList.toggle('active', m === 'pvp');
    document.getElementById('btnCPU').classList.toggle('active', m === 'cpu');
    reset();
  }

  function play(i) {
    if (gameOver || board[i]) return;
    if (mode === 'cpu' && current === 'O') return;
    mark(i);
    if (mode === 'cpu' && !gameOver) setTimeout(cpuMove, 420);
  }

  function mark(i) {
    board[i] = current;
    const cell = document.getElementById('c' + i);
    cell.textContent = current;
    cell.classList.add('taken', current.toLowerCase());

    const win = checkWin(board);
    if (win) {
      win.forEach(idx => document.getElementById('c' + idx).classList.add('win'));
      scores[current]++;
      updateScores();
      gameOver = true;
      setTimeout(() => showOverlay('win', current), 500);
    } else if (board.every(Boolean)) {
      scores.D++;
      updateScores();
      gameOver = true;
      setTimeout(() => showOverlay('draw', null), 500);
    } else {
      current = current === 'X' ? 'O' : 'X';
      const cpu = mode === 'cpu' && current === 'O' ? ' (computer)' : '';
      const st = document.getElementById('status');
      st.textContent = current + "'s turn" + cpu;
      st.style.color = current === 'X' ? xColor : oColor;
    }
  }

  function cpuMove() {
    if (gameOver) return;
    mark(minimax(board, 'O').idx);
  }

  function checkWin(b) {
    for (const [a, bc, c] of LINES)
      if (b[a] && b[a] === b[bc] && b[a] === b[c]) return [a, bc, c];
    return null;
  }

  function minimax(b, player) {
    const win = checkWin(b);
    if (win) return { score: b[win[0]] === 'O' ? 10 : -10 };
    const empty = b.map((v,i) => v ? null : i).filter(v => v !== null);
    if (!empty.length) return { score: 0 };
    const moves = empty.map(i => {
      const nb = [...b]; nb[i] = player;
      return { idx: i, score: minimax(nb, player === 'O' ? 'X' : 'O').score };
    });
    return player === 'O'
      ? moves.reduce((a,b) => b.score > a.score ? b : a)
      : moves.reduce((a,b) => b.score < a.score ? b : a);
  }

  function showOverlay(type, winner) {
    const ov = document.getElementById('overlay');
    const t  = document.getElementById('overlayTitle');
    const s  = document.getElementById('overlaySub');
    if (type === 'win') {
      t.textContent = winner + ' Wins!';
      t.style.color = winner === 'X' ? 'var(--x-color)' : 'var(--o-color)';
      s.textContent = winner === 'O' && mode === 'cpu' ? 'The computer got you.' : 'Well played!';
    } else {
      t.textContent = "It's a Draw!";
      t.style.color = 'var(--muted)';
      s.textContent = 'Evenly matched.';
    }
    ov.classList.add('show');
  }

  function closeOverlay() {
    document.getElementById('overlay').classList.remove('show');
    reset();
  }

  function updateScores() {
    document.getElementById('sx').textContent = scores.X;
    document.getElementById('so').textContent = scores.O;
    document.getElementById('sd').textContent = scores.D;
  }

  function reset() {
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    document.getElementById('overlay').classList.remove('show');
    for (let i = 0; i < 9; i++) {
      const c = document.getElementById('c' + i);
      c.textContent = '';
      c.className = 'cell';
    }
    const st = document.getElementById('status');
    st.textContent = "X's turn";
    st.style.color = xColor;
  }

  function resetAll() {
    scores = { X: 0, O: 0, D: 0 };
    updateScores();
    reset();
  }
</script>
</body>
</html>
